[project]
name = "discord-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "davey>=0.1.6",
    "discord-py>=2.7.1",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "spotipy>=2.26.0",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chencho_bot"]

[tool.mypy]
mypy_path = "src"
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "spotipy.*"
ignore_missing_imports = true
